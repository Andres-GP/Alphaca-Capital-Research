name: Promote to Staging

on:
  workflow_dispatch:
    inputs:
      strategy_path:
        description: "Ruta del notebook (research/strategies/nombre/)"
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python scripts/promote_to_staging.py ${{ github.event.inputs.strategy_path }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add staging/
          git commit -m "Promote strategy to staging"
          git push
