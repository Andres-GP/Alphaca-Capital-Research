name: Initial Research

on:
  workflow_dispatch:

concurrency:
  group: alphaca-initial-research-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Check required research credentials
    runs-on: ubuntu-latest
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
    env:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      MARKET_DATA_AUTOMATION_ENABLED: ${{ vars.MARKET_DATA_AUTOMATION_ENABLED }}
      RESEARCH_DATA_DIR: ${{ vars.RESEARCH_DATA_DIR }}
      RESEARCH_RUNNER_LABEL: ${{ vars.RESEARCH_RUNNER_LABEL }}
      AXI_MT5_PATH: ${{ vars.AXI_MT5_PATH }}
      AXI_MT5_LOGIN: ${{ secrets.AXI_MT5_LOGIN }}
      AXI_MT5_PASSWORD: ${{ secrets.AXI_MT5_PASSWORD }}
      AXI_MT5_SERVER: ${{ secrets.AXI_MT5_SERVER }}
      DARWINEX_MT5_PATH: ${{ vars.DARWINEX_MT5_PATH }}
      DARWINEX_MT5_LOGIN: ${{ secrets.DARWINEX_MT5_LOGIN }}
      DARWINEX_MT5_PASSWORD: ${{ secrets.DARWINEX_MT5_PASSWORD }}
      DARWINEX_MT5_SERVER: ${{ secrets.DARWINEX_MT5_SERVER }}
    steps:
      - name: Validate presence without printing secret values
        shell: bash
        run: |
          missing=()
          for name in CODEX_AUTH_JSON GEMINI_API_KEY SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_FROM; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "$MARKET_DATA_AUTOMATION_ENABLED" = "true" ]; then
            for name in RESEARCH_DATA_DIR RESEARCH_RUNNER_LABEL AXI_MT5_PATH AXI_MT5_LOGIN AXI_MT5_PASSWORD AXI_MT5_SERVER DARWINEX_MT5_PATH DARWINEX_MT5_LOGIN DARWINEX_MT5_PASSWORD DARWINEX_MT5_SERVER; do
              if [ -z "${!name:-}" ]; then missing+=("$name"); fi
            done
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required repository secrets: ${missing[*]}" >&2
            exit 1
          fi

  refresh-market-data:
    name: Refresh broker history on the private Windows VPS
    needs: [preflight]
    if: ${{ vars.MARKET_DATA_AUTOMATION_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ${{ vars.RESEARCH_RUNNER_LABEL || 'mt5-research' }}
    timeout-minutes: 360
    env:
      RESEARCH_DATA_DIR: ${{ vars.RESEARCH_DATA_DIR }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MT5 history adapter
        run: python -m pip install --disable-pip-version-check PyYAML MetaTrader5

      - name: Install optional exploration feed adapters
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check pandas dukascopy-python yfinance

      - name: Discover all tradable MT5 symbols and refresh screen bars
        env:
          AXI_MT5_PATH: ${{ vars.AXI_MT5_PATH }}
          AXI_MT5_LOGIN: ${{ secrets.AXI_MT5_LOGIN }}
          AXI_MT5_PASSWORD: ${{ secrets.AXI_MT5_PASSWORD }}
          AXI_MT5_SERVER: ${{ secrets.AXI_MT5_SERVER }}
          DARWINEX_MT5_PATH: ${{ vars.DARWINEX_MT5_PATH }}
          DARWINEX_MT5_LOGIN: ${{ secrets.DARWINEX_MT5_LOGIN }}
          DARWINEX_MT5_PASSWORD: ${{ secrets.DARWINEX_MT5_PASSWORD }}
          DARWINEX_MT5_SERVER: ${{ secrets.DARWINEX_MT5_SERVER }}
        run: python research_development/01_initial_research/data_pipeline/refresh_mt5_data.py

      - name: Refresh Yahoo daily ETF exploration series
        continue-on-error: true
        run: python research_development/01_initial_research/data_pipeline/refresh_yahoo_etfs.py

      - name: Refresh matching Dukascopy CFD/FX series
        continue-on-error: true
        run: python research_development/01_initial_research/data_pipeline/refresh_dukascopy.py

  research:
    name: Research ${{ matrix.family }}
    needs: [preflight, refresh-market-data]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.refresh-market-data.result == 'success' || needs.refresh-market-data.result == 'skipped') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ${{ vars.MARKET_DATA_AUTOMATION_ENABLED == 'true' && (vars.RESEARCH_RUNNER_LABEL || 'mt5-research') || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        family:
          - momentum_trend
          - mean_reversion
          - calendar_seasonality
          - overnight_gaps
          - carry_relative_value
    env:
      FAMILY: ${{ matrix.family }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RESEARCH_DATA_DIR: ${{ vars.RESEARCH_DATA_DIR }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check reportlab PyYAML

      - name: Install Codex CLI
        run: npm install --global @openai/codex

      - name: Prepare isolated Codex ChatGPT authentication
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "Missing required secret CODEX_AUTH_JSON" >&2
            exit 1
          fi
          export CODEX_HOME="$RUNNER_TEMP/alphaca-codex-${FAMILY}"
          mkdir -p "$CODEX_HOME"
          umask 077
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          echo "CODEX_HOME=$CODEX_HOME" >> "$GITHUB_ENV"
          chmod 700 "$CODEX_HOME"
          chmod 600 "$CODEX_HOME/auth.json"

      - name: Set report date
        id: date
        env:
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          value="$(python -c 'import datetime, os; print(datetime.datetime.fromisoformat(os.environ["RUN_STARTED_AT"].replace("Z", "+00:00")).strftime("%Y-%m-%d"))')"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Run the family research panel
        id: agents
        continue-on-error: true
        run: bash research_development/01_initial_research/automation/run_family.sh "$FAMILY" "${{ steps.date.outputs.value }}"

      - name: Upload family report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.family }}
          path: research_development/01_initial_research/reportes/${{ steps.date.outputs.value }}_${{ matrix.family }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Mark family job failed when a role failed
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.agents.outcome }}
        run: |
          if [ "$AGENT_OUTCOME" != "success" ]; then
            echo "Research panel failed for $FAMILY; any generated report artifact is preserved."
            exit 1
          fi

      - name: Remove temporary Codex authentication
        if: always()
        run: |
          if [ -n "${CODEX_HOME:-}" ] && [ -d "$CODEX_HOME" ]; then rm -rf "$CODEX_HOME"; fi

  publish-and-notify:
    name: Publish reports and notify
    if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [preflight, research]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Set report date
        id: date
        env:
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: echo "value=$(date -u -d "$RUN_STARTED_AT" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Download family artifacts
        id: download
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: research-*
          path: ${{ runner.temp }}/research-artifacts

      - name: Collect reports and build summary
        id: collect
        if: always()
        continue-on-error: true
        env:
          RUN_DATE: ${{ steps.date.outputs.value }}
          ARTIFACT_DIR: ${{ runner.temp }}/research-artifacts
          SUMMARY_JSON: ${{ runner.temp }}/research-summary.json
        run: >-
          python research_development/01_initial_research/automation/publish_reports.py
          --date "$RUN_DATE" --artifact-dir "$ARTIFACT_DIR"
          --repo-root "$GITHUB_WORKSPACE" --summary-json "$SUMMARY_JSON"

      - name: Prepare branch and pull request
        id: publish
        if: always()
        continue-on-error: true
        env:
          RUN_DATE: ${{ steps.date.outputs.value }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SUMMARY_JSON: ${{ runner.temp }}/research-summary.json
        run: |
          set -euo pipefail
          branch="research/$RUN_DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch" "origin/$BASE_BRANCH"
          fi
          python research_development/01_initial_research/automation/publish_reports.py \
            --date "$RUN_DATE" --artifact-dir "$RUNNER_TEMP/research-artifacts" \
            --repo-root "$GITHUB_WORKSPACE" --summary-json "$SUMMARY_JSON" --copy-artifacts
          report_count="$(python -c 'import json,os; d=json.load(open(os.environ["SUMMARY_JSON"])); print(sum(bool(x.get("report_path")) for x in d["families"]))')"
          if [ "$report_count" -eq 0 ]; then
            echo "No family report artifacts were available; no branch or PR was created."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for family in momentum_trend mean_reversion calendar_seasonality overnight_gaps carry_relative_value; do
            report_path="research_development/01_initial_research/reportes/${RUN_DATE}_${family}"
            if [ -d "$report_path" ]; then git add "$report_path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Add initial research reports for $RUN_DATE"
            git push origin "HEAD:refs/heads/$branch"
          fi
          python - <<'PY'
          import json, os
          p = os.environ["SUMMARY_JSON"]
          d = json.load(open(p, encoding="utf-8"))
          lines = [f"## Initial Research · {d['date']}", "", "Investigación inicial y backtest exploratorio solo cuando Gate A y el preregistro congelado lo permiten. Ningún resultado exploratorio confirma un edge.", "", "| Familia | Estado | Gate backtest | Backtest | Roles/motores | Reporte |", "|---|---|---|---|---|---|"]
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = f"research/{d['date']}"
          for f in d["families"]:
              engines = "; ".join(f"{k}: {v}" for k, v in f.get("engines", {}).items()) or "sin artefacto"
              link = f"[Markdown](https://github.com/{repo}/blob/{branch}/{f['report_path']})" if f.get("report_path") else "sin reporte"
              gate = f.get("exploratory_backtest_gate", "unknown")
              ran = "ejecutado" if f.get("backtests_run") else "no ejecutado"
              lines.append(f"| {f['family']} | {f['status']} | {gate} | {ran} | {engines} | {link} |")
          lines.extend(["", "Cobertura y huecos de datos: desconocidos hasta medirlos contra calendarios verificados. Gates estadísticos, robustez y costos: pendientes.", "Fallback: Gemini 3.8 Flash vía Gemini API (thinking high) si falla Codex."])
          open(os.environ["RUNNER_TEMP"] + "/pr-body.md", "w", encoding="utf-8").write("\n".join(lines) + "\n")
          PY
          existing="$(gh pr list --state open --head "$branch" --base "$BASE_BRANCH" --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/pr-body.md"
            pr_url="$existing"
          else
            pr_url="$(gh pr create --head "$branch" --base "$BASE_BRANCH" --title "Initial Research · $RUN_DATE" --body-file "$RUNNER_TEMP/pr-body.md")"
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Send run summary email
        id: email
        if: always()
        continue-on-error: true
        env:
          RUN_SUMMARY_JSON: ${{ runner.temp }}/research-summary.json
          PULL_REQUEST_URL: ${{ steps.publish.outputs.pr_url }}
          PUBLISH_STATUS: ${{ steps.publish.outcome }}
        run: python research_development/01_initial_research/automation/send_email.py

      - name: Report final workflow status
        if: always()
        env:
          MATRIX_OUTCOME: ${{ needs.research.result }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          EMAIL_OUTCOME: ${{ steps.email.outcome }}
        run: |
          if [ "$MATRIX_OUTCOME" != "success" ] || [ "$COLLECT_OUTCOME" != "success" ] || [ "$PUBLISH_OUTCOME" != "success" ] || [ "$EMAIL_OUTCOME" != "success" ]; then
            echo "One or more research, publishing, or notification steps failed."
            exit 1
          fi
