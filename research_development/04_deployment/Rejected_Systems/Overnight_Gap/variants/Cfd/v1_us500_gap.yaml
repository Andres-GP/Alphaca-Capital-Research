id: v1_us500_gap
edge: overnight_gap
status: in_development

instrument:
  ticker: us500
  start: "2018-01-01"

split:
  oos_start: "2022-01-03"

# ============================================================
# NOTEBOOK 01 usa estos.
# REGLA: cada params.X DEBE aparecer literal en grid.X_values.
# ============================================================
params:
  gap_min_trade: 1.0
  gap_threshold: 1.5
  gap_max_tf: 4.0
  entry_tf_min: 15
  entry_window_start: "09:40"
  entry_window_end: "11:00"
  mr_fill_target: 0.75
  mr_stop_atr_mult: 1.0
  tf_target_mult: 1.5
  tf_stop_atr_mult: 1.25
  time_exit: target_or_eod
  skip_fridays: true
  slip_bps_per_side: 3.0

