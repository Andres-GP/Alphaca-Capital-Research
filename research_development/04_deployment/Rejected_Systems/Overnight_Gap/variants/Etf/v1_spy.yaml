id: v1_spy_gap
edge: overnight_gap
status: in_development

instrument:
  ticker: spy
  start: "2018-01-01"

split:
  oos_start: "2022-01-03"

# ============================================================
# PARÁMETROS BASE (los del documento original)
# ============================================================
params:
  gap_min_trade: 0.5
  gap_threshold: 1.0
  gap_max_tf: 4.0
  entry_tf_min: 15
  entry_window_start: "09:40"
  entry_window_end: "11:00"
  mr_fill_target: 0.75
  mr_stop_atr_mult: 1.0
  tf_target_mult: 1.5
  tf_stop_atr_mult: 1.25
  time_exit: target_or_eod
  skip_fridays: true
  slip_bps_per_side: 3.0

# ============================================================
# GRID (puedes mantener el que ya tenías)
# ============================================================
grid:
  gap_min_trade: [0.3, 0.4, 0.5, 0.6, 0.7]
  gap_threshold: [0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3]
  mr_fill_target_values: [0.30, 0.40, 0.50, 0.60, 0.75, 0.85, 0.95]
  mr_stop_atr_mult_values: [0.5, 0.7, 0.9, 1.0, 1.1, 1.3, 1.5]
  tf_target_mult_values: [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.5, 3.0]
  tf_stop_atr_mult_values: [0.75, 1.0, 1.25, 1.5, 1.75]

engine_defaults:
  data_source: csv_intraday
  # ⚠️ IMPORTANTE: descarga datos de SPY (ej. desde Alpaca) y pon aquí la ruta a tu CSV
  csv_path: "../../../data/spy_m5_utc.csv"
  session_tz: "America/New_York"
  session_open: "09:30"
  session_close: "16:00"
  financing_bps_per_night: 0.0
  risk_per_trade_pct: 1.0
  max_exposure: 1.0
