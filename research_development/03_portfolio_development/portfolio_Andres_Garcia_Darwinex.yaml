name: portfolio_Andres_Garcia_Darwinex
returns_dir: ../../02_strategy_development/notebooks
strategies: [RSI2.v1_nas100, RSI2.v2_us500] # <edge>.<variante>; el orden = prioridad en la selección; omitir = todas
eval_start: 2018-01-01 # evaluar solo desde el OOS (usar el oos_start más tardío de las variantes); null = todo

selection:
  max_corr: 0.5 # entra solo si su correlación con las ya elegidas <= este valor

weights:
  method: inverse_vol # equal | inverse_vol | erc | hrp
  lookback: 252 # días de ventana para estimar (solo pasado)
  rebalance_days: 21

risk:
  target_vol: 0.10 # anual; null para desactivar
  vol_lookback: 60
  max_leverage: 3.0
  dd_trigger: 0.05 # null para desactivar; reduce tamaño si el drawdown del portfolio >= 5%
  dd_factor: 0.5

out_dir: ../runs
