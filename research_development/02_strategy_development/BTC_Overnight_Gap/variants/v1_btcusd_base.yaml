id: BTCOVN.btcusd.base.v1
# BASE instrument: the research (notebooks 01-03) is done ONCE here. Vehicles (BTC-JPY, ...) only pass the parity cell (section 10 of notebook 01) and notebook 04.
instrument:
  ticker: btcusd # data/btcusd*.csv (MT5 export, H1), any case. Axi BTCUSD CFD: VERIFY there are no missing hours around 21-23 UTC (check 3.1 of notebook 01)
  start: "2018-01-01"
params:
  entry_hour_utc: 21 # buy at the OPEN of the 21:00 UTC bar ...
  hold_hours: 2 # ... and sell 2 hours later (23:00 UTC), Quantpedia rule
  trend_mode: "off" # off | up   (Quantpedia filters are only TESTED in notebook 01 section 4.3, not configured)
  sma_len: 50
  vol_mode: "off" # off | high | low
  vol_len_days: 30
  days: [0, 1, 2, 3, 4, 5, 6] # UTC weekday of the entry bar (Mon=0)
  stop_pct: 0.0 # 0 = no stop. Section 4.5 of notebook 01 sweeps it
  side: long
  cost_bps_per_side: 3.0 # VERIFY spread + commission at 21-23 UTC
grid:
  entry_hour_values: [19, 20, 21, 22, 23]
  hold_hours_values: [1, 2, 3, 4]
sizing:
  capital: 100000.0 # research capital: big enough for the 0.1 BTC minimum lot at any historical price
  hard_limit: 0.07 # Axi Select: 7% static max loss on the allocation
oos_start_ts: "2023-01-02" # adjust to ~35% of the usable history once the CSV is loaded
engine_defaults:
  data_source: csv_h1
  server_ny_offset_h: 7 # server = NY + 7h all year (GMT+2/+3 with US DST). VERIFY with a known candle; use null + server_tz if the export is in a real tz
  rollover_hour_ny: 17
  swap_long_pct_annual: 20.0 # MT5 spec BTCUSD: swap long -20 (percentage)
  swap_mult: { 0: 1, 1: 1, 2: 1, 3: 1, 4: 3, 5: 0, 6: 0 } # MT5 swap rates: Fri x3 (VERIFY which weekday the broker charges in notebook 04)
  size_fraction: 1.0
  contract_size: 1.0 # BTC per lot -- VERIFY in MT5 (Specification)
  min_lot: 0.1
  lot_step: 0.1
  quote_to_account: 1.0
run_dir: runs/v1_btcusd_base
