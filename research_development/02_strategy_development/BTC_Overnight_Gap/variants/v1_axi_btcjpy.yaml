id: BTCOVN.btcjpy.axi.v1
# VEHICLE for Axi Select: same rules as the base, only contract / swap / quote currency / sizing change.
# Run notebook 01 (section 10 = parity vs the base) and notebook 04 on this variant. Do NOT re-run 02/03 here.
parity_base: v1_btcusd_base # variants/<name>.yaml of the base instrument
instrument:
  ticker: btcjpy # data/btcjpy*.csv (MT5 export, H1), any case. CHECK that Axi Select copies this symbol to the Allocation Account (public lists only name BTCUSD and ETHUSD)
  start: "2018-01-01"
params:
  entry_hour_utc: 21
  hold_hours: 2
  trend_mode: "off"
  sma_len: 50
  vol_mode: "off"
  vol_len_days: 30
  days: [0, 1, 2, 3, 4, 5, 6]
  stop_pct: 0.0
  side: long
  cost_bps_per_side: 5.0 # VERIFY: BTC-JPY spread is usually wider than BTCUSD
grid:
  entry_hour_values: [19, 20, 21, 22, 23]
  hold_hours_values: [1, 2, 3, 4]
axi_select: # Seed: your 0.01 lot is copied x10 to the 5,000 Allocation Account (VERIFY the multiplier in the official rules)
  own_equity: 500.0
  multiplier: 10.0
sizing:
  capital: 5000.0 # Allocation Account = own_equity x multiplier
  hard_limit: 0.07 # 7% static max loss on the allocation at Seed
oos_start_ts: "2023-01-02"
engine_defaults:
  data_source: csv_h1
  server_ny_offset_h: 7
  rollover_hour_ny: 17
  swap_long_pct_annual: 15.0 # MT5 spec BTC-JPY: swap long -15 (percentage)
  swap_mult: {0: 1, 1: 1, 2: 1, 3: 1, 4: 3, 5: 0, 6: 0}
  size_fraction: 1.6 # the minimum copied lot (0.1 BTC ~ 7.7k USD) already weighs ~1.5x of the 5k allocation: the notebook shows if it is executable and safe (5.1)
  contract_size: 1.0 # 1 lot = 1 coin
  min_lot: 0.01 # your own account; the notebooks multiply min_lot / lot_step by axi_select.multiplier
  lot_step: 0.01
  quote_to_account: 0.0065 # JPY -> USD, ~1/USDJPY. VERIFY and update
run_dir: runs/v1_axi_btcjpy
