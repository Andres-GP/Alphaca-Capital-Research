id: MONDAY.btcusdt.base
edge: monday_effect
status: in_development # in_development | validated | rejected | demo | approved

instrument:
  ticker: btcusdt # label only: the data comes from the CSV below
  start: "2017-01-01"

split:
  oos_start: "2024-01-08" # same cut for every variant of the edge

# Values used by notebooks 01 and 03 (frozen after notebook 02)
params:
  vol_mode: pctl # pctl (v3) | band (v1) | none
  atr_pctl: 30.0 # trade only if ATR% is above this percentile of its last year
  atr_len: 48 # ATR candles (1h)
  skip_first_monday: true # calendar filter: day of month <= 7 is skipped
  entry_hour: 0 # UTC, Monday 00:00 (signal = Sunday 23:00 close)
  hold_bars: 24 # exit at Tuesday 00:00 open
  cost_bps_per_side: 14.0 # Binance spot: fee + spread + slippage

# Grid swept by notebook 02 and reused by the validation gate in notebook 03
grid:
  atr_pctl_values: [0, 10, 20, 30, 40, 50, 60]
  atr_len_values: [12, 24, 48, 72, 96, 168]

# Passed to monday_effect_engine.set_engine_defaults(**cfg["engine_defaults"]) in every notebook.
# Only these keys are valid; any other key raises a KeyError.
engine_defaults:
  data_source: csv_hourly
  csv_path: "../../../data/binance/BTCUSDT_1h.csv"
  pctl_window: 8760 # 1 year of hourly candles
  pctl_min_bars: 4380 # warm-up before the percentile counts (half a year)
  financing_bps_per_night: 0.0 # spot: no swap
  rollover_hour_utc: 22
  size_fraction: 0.40 # the robot: 40 % of capital per trade
